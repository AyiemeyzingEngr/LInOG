# linog_mixed.cfg -- the FBS+FBD and FBD-only settings of linog_auto v0.13 (ascending record 4.2, 4.3, 18.5).
# KEY=value lines only: parsed by lp_p1.py (load_mixed). Tests point LINOG_MIXED_CFG at their own copy.
# The band-limit of the FBS dates of an FBS+FBD frame (bandlimit, P1bs): the course kit's tool and the filter module it
# imports, at their pins (the kit's MANIFEST.md5 045ae9e2...; felix's KIT copies read equal by RA2, 11 Oct 2026, DR6),
# called with the kit's keep fraction and taper. keep_fraction is the share of the sampling rate kept: the cutoff is
# keep_fraction / 2 = 0.21875 cycles a sample, 7 MHz at 32 MHz, so 14 of FBS's 28 MHz, at native width (E64: the tool's
# docstring reads "14/32*2 = 0.4375", and 14/32 x 2 is 0.875; the value passed is this one)
KEEP_FRACTION=0.4375
TAPER_WIDTH=0.05
KIT_FBS_BANDLIMIT_MD5=5befb0bd7a9b71bd6d5da3737cce7898
KIT_FBS_DOWNSAMPLE_MD5=69323fe81c0b74c14415c76306f5ce92
# the range looks of an FBD-only frame (R6-d, 18.5): 6 FBD looks give 56.2111 m of slant range, as 12 FBS looks do
# (RA1: every FBS shelve 4.684257156 m, every FBD shelve 9.368514313 m); Phase 2 puts it in place of STACK_RLKS on an
# FBD-only frame only, so linog_stack.cfg stays byte-identical and no other frame's fingerprint moves
STACK_RLKS_FBD=6
