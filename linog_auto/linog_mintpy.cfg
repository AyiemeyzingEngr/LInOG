# linog_mintpy.cfg -- Phase 4.5 and Phase 5 (the report and MintPy) settings and pins for linog_auto v0.6; v0.8: D9's two
# anchors replaced by the A/B's settings (below); v0.10: admit's rules and dfit's time limit (below).
# KEY=value lines only; parsed by lp_p5.py. Tests point LINOG_MINTPY_CFG at their own copy.
# v0.6 made it a new file, so linog_paths.cfg, linog_env.cfg, linog_stack.cfg and linog_run.cfg kept their bytes and the
# frames' Phase 0 to 4 records stayed CURRENT; a phase's fingerprint holds the settings it reads, not this file's md5, so the
# keys v0.10 adds reach admit and dfit only. Sources: RD6 (felix, 28 Sept 2026: the env, MintPy 1.6.2's defaults file, the
# census of the 12 delivered cfgs), the course kit (linog_frame.sh ph_prep, ph_pin, ph_invert, ph_refpix; the report
# scripts), linog_phase56_recipe, feedback_mintpy_config_isce2, record sections 47 and 49.
#
# -- MintPy in the pinned env (RD6: mintpy 1.6.2; its defaults file = PyPI's 1.6.2, 350 lines, 119 keys)
MINTPY_VERSION=1.6.2
MINTPY_DEFAULTS_MD5=ddae810fd680f184140d39810bf911f7
MINTPY_DEFAULT_KEYS=119
#
# -- the kit's tools these phases call, in KIT (linog_env.cfg), md5 as the course kit and RD6 read them on felix
KIT_ADMIT_MD5=8cff02ed89bcaf5b600a802306f6b1d4
KIT_REFPIX_MD5=cf7e059d7a174d851edd2afb434cf706
#
# -- the report (Phase 4.5): the kit's rendering (linog_save_insar_images.py 402141d9: one pixel per pixel at 600 dpi,
# phase in jet, phase and magnitude in HSV with the magnitude stretched 1 to 99 %) and its pages (linog_create_grid.py
# 025340aa: 12 pairs a page, US Letter landscape at 300 dpi). North up comes from the frame's own geometry (D4).
REPORT_PAIR_DPI=600
REPORT_PAGE_DPI=300
REPORT_PER_PAGE=12
REPORT_STRETCH_LOW=1
REPORT_STRETCH_HIGH=99
#
# -- D9, v0.8 (record 62.0 and 63.8): admit takes unwrapError no, MintPy's default, unless recon/admission.txt names the
# method; the mean component fraction of the kept pairs over the kit's G19 valid area stays in its record as evidence
# (v0.6's two anchors on it, 0.34 and 0.90, are gone: 9 of the 12 v1.2 frames and F3320 fell between them, RD7). After
# sbas, d9ab runs MintPy with bridging (ramp linear) on a copy B of mintpy/'s inputs and applies the rule of 62.0:
# bridging if and only if MintPy on B ends rc 0 with unwrapPhase_bridging and its products, B's maskTempCoh keeps at
# least ceil(min(D9AB_MIN_GAIN_CAP, D9AB_MIN_GAIN_FRAC x length x width)) px more than A's (MintPy's smallest component
# on the grid: 1,536 px on F3320's 658 x 778), and the velocity std over the pixels both masks keep is no larger in B.
# bridging there is a DECISION: the operator's recon/admission.txt takes the method.
D9AB_MIN_GAIN_CAP=2500
D9AB_MIN_GAIN_FRAC=0.003
# v0.10, R5 (record 108.3): under --decide auto d9ab takes a bridging verdict itself (recon/d9ab_decision.json), moves
# the frame's mintpy/ into _archive/mintpy_nobridging_<UTC>/ and asks the driver to restart once; under ask it stays a
# DECISION. No key: the rule above is unchanged.
# MintPy on B is stopped after D9AB_TIMEOUT_S seconds (RD8: 160 s on F3320). A new A/B needs twice the copy's size plus
# D9AB_FREE_GIB free at the record folder: B holds the copy and MintPy's products on it (1.299 GiB on F3320, twice its
# 0.646 GiB copy)
D9AB_TIMEOUT_S=3600
D9AB_FREE_GIB=2
G19_EDGE=20
#
# -- v0.10, admit's rules (record 108.3, approved in 109.0). R1: the kit's statistics (linog_admit.py's own rule:
# LARGEST under 0.20 or R under 0.25; the date screen at 3.0x) over land, the land being the finite heights of
# geom_reference/hgt.rdr off the water tool's flat_masks() (linog_watermask.py at KIT_WATERMASK_MD5 of linog_phase6.cfg);
# with fewer than ADMIT_LAND_MIN_PX land px (RD10's floor, record 96.2) no pair is flagged and no date screened (WARN).
ADMIT_LAND_MIN_PX=50000
# R3: a date leaves the network (excludeDate) when more than ADMIT_DEAD_SHARE of its pairs are flagged over land, or when
# it has fewer than 2 pairs, until none is left; it holds when the rest keeps min_dates (the path table) in one component,
# every date in 2 pairs or more, at most ADMIT_EXCL_MAX_FRAC of the dates excluded (record 7.2's limit for D2) and D1's
# reference date; otherwise a DECISION.
ADMIT_DEAD_SHARE=0.5
ADMIT_EXCL_MAX_FRAC=0.25
# R2: on the network R3 leaves, the land cull is taken whole when it removes ADMIT_CULL_MAX_FRAC of its pairs or fewer,
# leaves one component and every date in 2 pairs or more; otherwise no pair is culled (WARN). v0.12: the cull is drop1's
# (below), and these guards bound it.
ADMIT_CULL_MAX_FRAC=0.10
# -- v0.12, drop1 (record 124.7; Doc JD's drop-one test, 119.5; the rule, 120.5; Ariel's word, 125.0): after sbas, each
# pair R1 flags, over land or over the whole grid, is dropped from a copy of the stack and the network inverted again
# (MintPy's ifgram_inversion.py), and so is each of its DROP1_PEERS unflagged peers nearest it in mean land coherence; a
# flagged pair is culled when dropping it gains more coherent land (temporal coherence of DROP1_TCOH_MIN or more on R1's
# land, against sbas's own) than dropping any peer [CONFIRM WITH PL: the 10 peers, an ordinary pair beating all of them
# one time in 11]. DROP1_TCOH_MIN is the template's minTempCoh (MintPy's default, 0.7); DROP1_WORKERS inversions at a time,
# each stopped after DROP1_TIMEOUT_S (E1: 1 min 34 s on F3320); a new test needs DROP1_FREE_GIB free beyond its copies.
# v0.12 r2 (record 127): a flagged pair tested against fewer than DROP1_MIN_PEERS peers is kept (a small network gives fewer
# testable peers; with n of them an ordinary pair beats all n one time in n + 1, so 10 holds the 1 in 11) [CONFIRM WITH PL].
# It is at most DROP1_PEERS.
DROP1_PEERS=10
DROP1_MIN_PEERS=10
# v0.13 r2, the split rule, balanced (the ascending record 18.3; Ariel's word, 18.0): a flagged pair's peers are the
# DROP1_PEERS_SIDE unflagged pairs nearest it at or below its mean land coherence and the DROP1_PEERS_SIDE nearest above
# (ties to the earlier name); it is untestable, and kept, with fewer on a side or when those peers' mean coherence lies more
# than DROP1_PEERS_BALANCE from its own; a tested pair is named when its net exceeds every peer's. DROP1_PEERS is then
# 2 x DROP1_PEERS_SIDE (drop1 refuses another value) and DROP1_MIN_PEERS (10) 2 x DROP1_PEERS_SIDE at most. Both keys are
# in admit's drop1_basis, so a decision file made under v0.12 r2's rule is not applied (D1d). The guard (19.6, as 20.1
# approved it) has no key: under --decide auto a named pair is culled only when its n_dv_gt1 is at most its peers' highest.
DROP1_PEERS_SIDE=5
DROP1_PEERS_BALANCE=0.005
DROP1_TCOH_MIN=0.70
DROP1_WORKERS=8
DROP1_TIMEOUT_S=1800
DROP1_FREE_GIB=10
# R4 (the phase dfit, after wmask): a date the screen proposes stays in the network; the velocity fit
# (timeseries2velocity.py on timeseries_ramp_demErr.h5) runs with MintPy's own exclusions (A) and with the date excluded
# too (B), and the date leaves the fit (mintpy/exclude_date.txt) when B's velocity std over maskTempCoh is lower; each fit
# is stopped after DFIT_TIMEOUT_S seconds
DFIT_TIMEOUT_S=1800
# v0.13 r3 (the ascending record 96.3, 97.6): dfit's DEM-error loop runs at most this many passes, then holds (G5f.10
# DECISION; a person's set goes in recon/demfit.txt); in dfit's fingerprint
DFIT_DEMFIT_MAX_PASSES=4
#
# -- the grid (the kit's ph_pin): SNWE snapped outward on the 1/1200 deg lattice with a 2 px margin
SNWE_LATTICE=1200
SNWE_MARGIN_PX=2
#
# -- G24: the stack's HEADING must say the path table's direction (ALOS-1: ascending about -11 deg, descending
# about -169 deg; RD6 read -168.94 on F3320)
HEADING_TOL_DEG=30
#
# -- the cfg (mcfg): MintPy's defaults file, with these values put in place (the keys the 12 delivered cfgs set alike,
# RD6's census, with F40 to F44 applied). {W} is the frame folder and {REF} the reference date. The per-frame keys come
# from the phases: network.excludeDate and excludeDate12 and unwrapError (admit: D3 and D9), geocode.SNWE (mcfg,
# from the frame's geometry), reference.yx (auto, then the kit's G19 pick in sbas), and ORBIT_DIRECTION (the path
# table's direction; load_data writes a MACRO_CASE template key into the stack, F38).
CFG.mintpy.load.processor=isce
CFG.mintpy.load.metaFile={W}/SLC/{REF}/data.dat
CFG.mintpy.load.baselineDir={W}/baselines
CFG.mintpy.load.unwFile={W}/Igrams/*/filt_*.unw
CFG.mintpy.load.corFile={W}/Igrams/*/filt_*.cor
CFG.mintpy.load.connCompFile={W}/Igrams/*/filt_*.unw.conncomp
CFG.mintpy.load.demFile={W}/geom_reference/hgt.rdr
CFG.mintpy.load.lookupYFile={W}/geom_reference/lat.rdr
CFG.mintpy.load.lookupXFile={W}/geom_reference/lon.rdr
CFG.mintpy.load.incAngleFile={W}/geom_reference/los.rdr
CFG.mintpy.load.azAngleFile={W}/geom_reference/los.rdr
CFG.mintpy.load.shadowMaskFile={W}/geom_reference/shadowMask.rdr
CFG.mintpy.load.updateMode=no
CFG.mintpy.networkInversion.maskDataset=coherence
CFG.mintpy.networkInversion.maskThreshold=0.3
CFG.mintpy.topographicResidual=yes
CFG.mintpy.troposphericDelay.method=no
CFG.mintpy.deramp=linear
CFG.mintpy.geocode.laloStep=-0.000833333,0.000833333
