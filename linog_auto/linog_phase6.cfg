# linog_phase6.cfg -- linog_auto v0.7: the settings and pins of Phase 5e (wmask) and Phase 6 (deliver, accept, package);
# v0.8 adds RUN_MANIFEST.json's lead product and readings (at the end).
# KEY=value lines; # starts a comment. LINOG_PHASE6_CFG names another copy (the self-test's).
#
# The kit's tools, called from $S (linog_env.cfg's KIT) unchanged (design D-B), at the md5s the course kit and felix's
# $S carry (RD6, 28 Sept 2026: 14 of 14 as the course kit):
KIT_WATERMASK_MD5=907cf8564db2cd4c2959ed6e2b41bbc5
KIT_PHASE6_MD5=43d6c15baeb08bb568be33dfdbb5a7b6
KIT_LOS2HV_MD5=ada17e1486b85ba7a74f16f57092bf08
KIT_EMBED_MD5=c35e935adbe6dc6381d857d516a5fe91
KIT_KMZ_MD5=45dc2d01afbe4f71e895ce89511782b0
# the kit's verifier; accept runs this package's copy of it (linog_verify_frame_d6.py, D6: N22 reads each date's mode
# from recon/modes.json when the frame has one); the package's MANIFEST.md5 carries the copy's md5
KIT_VERIFY_MD5=7f2b53cfe460fe6c002c18bcc1308801
VERIFY_COPY=linog_verify_frame_d6.py
#
# The delivery's standard (the 12 frames, v1.2): 16 files at the top of LInOG_Upload_<TAG>/ (6 GeoTIFF, 6 PNG, 4 KMZ);
# D5: the report's pages in its reports/ by hard link. The renders' colour range is the pinned script's own (G14 reads
# its save_kmz.py and view.py lines: -10 to 10 cm/yr).
DELIVERY_FILES=16
DELIVERY_TIF=6
DELIVERY_PNG=6
DELIVERY_KMZ=4
# D7c: los.rdr's heading against MintPy's HEADING (the orbit's; F55 measured 1.11 deg on F3320), and its incidence
# against inputs/geometryRadar.h5's (the same band, loaded by MintPy): a misread los.rdr fails here
LOS_HEADING_TOL_DEG=3
LOS_INCIDENCE_TOL_DEG=0.01
#
# D8: the review package, by hard links under <frame>/_xfer/, <PREFIX>_<TAG>_<VERSION>_<YYYYMMDD UTC>_review/, with
# TRANSFER_MANIFEST_<TAG>.txt at its root (./ paths, never self-listed) and RUN_MANIFEST.json beside it (a link too)
XFER=_xfer
PACKAGE_PREFIX=LINOG_DESC
# v0.13 (the ascending record 11.13, 22-b): an ascending path's package; PACKAGE_PREFIX stays a descending path's
PACKAGE_PREFIX_ASC=LINOG_ASC
PACKAGE_VERSION=v0.1
#
# v0.8, RUN_MANIFEST.json (record 73.2 to 73.4). LEAD_PRODUCT: the velocity readers take first, by its file stem
# (<TAG>_<LEAD_PRODUCT>.tif, with its Vertical and Horizontal projections); LEAD_REASON: the one line the manifest carries.
LEAD_PRODUCT=Velocity_demErr_ramp
LEAD_REASON=the removed ramp is a per-acquisition field shared by the frames of one orbit and decaying over 300 to 500 km, the ionosphere's scale (record 73.2); on F3320 the two chains agree within 0.06 mm/yr out to 5 km of the reference
# The readings (not gates): medians and cell counts of the delivered GeoTIFFs in mm/yr, with distances between cell
# centres, equirectangular at 111.32 km per degree, the cosine at the centre point's latitude (S20's around20.py, the
# review's pimo35): rings around the reference between the READ_RINGS_KM edges, then the whole frame, in the
# READ_RING_PRODUCTS; and for each GNSS station, NAME:lat:lon in GNSS_STATIONS, the median of the disc of each
# READ_DISCS_KM radius around it minus that of the same disc around the reference, in the READ_DISC_PRODUCTS (record
# 73.3). A station outside the grid, or a disc with no valid cell, is named with no difference.
READ_RINGS_KM=0,0.5,1,2,5,10,20
READ_RING_PRODUCTS=demErr,demErr_ramp
READ_DISCS_KM=0.3,0.5,1.0
READ_DISC_PRODUCTS=Vertical,Vertical_ramp,demErr,demErr_ramp
# PIMO: IGS, Quezon City, network.igs.org/PIMO00PHL; its rate over 2006 to 2011 [VERIFY]
GNSS_STATIONS=PIMO:14.635719:121.077731
#
# v0.13 r2, G6a.11: the mode step (DB1; the ascending record 15.2, with DB1-a to DB1-d as Ariel approved them, 16.1, and 16.2's
# size line), a reading of deliver, not a gate (lp_modestep.py). RA1's values (expect_ra1.json; mk_expect.py's alpha and tests):
# at least 3 dates of each mode in the velocity fit, at least 1,000 pixels in the population, the planarity and ROUTE 1 voided
# above 1e-3 (relative), a form bounded by its share at L95 0.30, the line t(1 - 0.05 / (2 x 24), n - 3) (DB1-a). The changes:
# dem_error's date set the candidate with the smaller |partial r(c, bperp)|, at most 1e-5; and the bound by size (DB1-d), B95 at
# most 0.0039 m/yr across the frame, the single-path noise floor (16.2: the census's "large" bar is not on record).
MODESTEP_MIN_PER_MODE=3
MODESTEP_MIN_PIXELS=1000
MODESTEP_PLANARITY_VOID=1e-3
MODESTEP_ROUTE1_VOID=1e-3
MODESTEP_L95_MAX=0.30
MODESTEP_ALPHA=0.05
MODESTEP_TESTS=24
MODESTEP_PARTIAL_R_MAX=1e-5
MODESTEP_B95_MAX_M_YR=0.0039
