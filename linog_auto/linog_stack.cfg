# linog_stack.cfg -- Phase 2 (stack configuration) settings and tool pins for linog_auto v0.3.
# KEY=value lines only; parsed by lp_p2.py. Tests point LINOG_STACK_CFG at their own copy.
# A new file, so linog_paths.cfg and linog_env.cfg stay byte-identical to v0.2 and the frame's Phase 0 and 1
# records stay CURRENT. Every value below was measured on felix (RD3, 27 Sept 2026) or is the 12 frames' Phase 2.
#
# the pinned env's prefix (RD2 == 2, 26 Sept 2026: "env linog_isce2  prefix /eggraid/miniconda3/envs/linog_isce2").
# Phase 2 finds its tools here with or without an active env, so the state check (outside the env) and the phase
# (inside it) hash the same files; the phase checks that the activated env's CONDA_PREFIX is this folder.
ENV_PREFIX=/eggraid/miniconda3/envs/linog_isce2
# stripmapStack inside the pinned env (<ENV_PREFIX>/share/isce2/stripmapStack; conda-forge isce2 2.6.4). It is not
# on the clean env's PATH (RD2 F2, RD3), so Phase 2 calls stackStripMap.py by absolute path, md5 pinned (F13).
STACK_DIR_REL=share/isce2/stripmapStack
STACKSTRIPMAP_MD5=30c0d85b6d4e11605ececef910cfbd5a
STACK_PY_MD5=bad64ed9062c5a2870a4c9a42a8f2544
# the kit's network table, in KIT (linog_env.cfg); it reads its dates from a phase1_dates.json (F11)
KIT_NET_TABLE_MD5=40bf01de4b4872b624da774fcc20ad9c
# the 12 frames' stackcfg: stackStripMap.py -W interferogram --nofocus -s SLC -d DEM/<dem> -t 730 -b 1500 -a 28 -r 12 -u snaphu
# (linog_phase2_recipe; rehearsal R5 and R7; RD3 on P084 F3320: 157 pairs on 24 dates)
STACK_T_DAYS=730
STACK_B_M=1500
STACK_ALKS=28
STACK_RLKS=12
STACK_UNW=snaphu
# pass 2 computes the baselines against the reference, pass 1 against the first date: on P084 F3320 the two passes'
# |bperp differences| differ by up to 0.343 m (RD3). A pair within PAIR_FLIP_M (m) of -b in either pass may be in one
# pass's network and not the other's; stack2 accepts such a difference with WARN and lists it, any other one FAILs.
PAIR_FLIP_M=1.0
# D1, the reference rule (record 7.4, Q3): candidates have degree >= max degree - D1_DEGREE_SLACK, the earliest date excluded
# (invertMisreg pins it, N23); the modal width first; then the date nearest the temporal midpoint
D1_DEGREE_SLACK=1
# the kit's net table notes "near -b limit" above this MAXBP (m)
NEAR_B_M=1450
# dates of this degree or less are reported as thin nodes (F15; the kit's THIN NODE is degree <= 3)
THIN_DEGREE=3
