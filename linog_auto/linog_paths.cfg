# linog_paths.cfg -- path table for linog_auto, the LInOG ALOS-1 automated pipeline.
# Every value is measured; the source is written beside it. Environment overrides:
# LINOG_ROOT, LINOG_ARCHIVE, LINOG_DEM (and LINOG_AUTO_CFG to point at another copy of this file).
# v0.13 (ascending automation record 3.6, 9.3, 13.4, 14.4): the ascending entries with their counts and footprints, a
# [p450], G0.16's framing settings and the frame law, the beam guard's beams, the footprint checks. A path the table lacks
# gets a derived entry (R8): residue by the path formula, direction by the frame rule, the date law from the frame's own
# granules; recon writes recon/path_entry.cfg for a person to review and add here. A key dem_<frame> in a path's section
# names that frame's DEM in place of dem (14.4); none is set yet (the DEM block, F77, makes the DEMs first).

[defaults]
# felix project tree and raw archive (driver linog_frame.sh lines 28 and 31)
root = /eggraid/home/arieln/projects/linog/insar
archive = /eggraid/data/alos
# shared SRTM DEM, 1 arcsec, 120-123 E, 14-18 N (read from its .vrt, 26 Sept 2026); SRTM for path 84 per Ariel, 26 Sept
dem = /eggraid/home/arieln/projects/linog/insar/shared_dem/demLat_N14_N18_Lon_E120_E123.dem.wgs84
# the frame footprint must sit inside the DEM with at least this margin on every side (deg)
dem_margin_deg = 0.1
# a stack needs at least min_dates kept dates (FAIL below), warn below warn_dates
min_dates = 5
warn_dates = 12
# disk budget: the 12 ascending frames used about 235 GiB for 24 dates (platforms record)
disk_gib_per_date = 12
disk_gib_margin = 50
# off-nadir tolerance around the modal beam (deg), as linog_preflight_summary.py
offnadir_tol = 0.5
# v0.13, G0.18 (R8-e, ascending record 13.4): the beams linog_auto has run (off-nadir, deg); any other modal beam is a
# DECISION unless recon/beam.txt accepts it
beams_run = 34.3
# v0.13, G0.16, the framing check along track (ascending record 9.3): km along each cell's own track, from field (c) of
# the middle image record; framing_max_km 0.1 deg of latitude along these tracks (112.720 to 112.746 km a degree over the
# 21 judged cells, 9.4); framing_anchor_km 0.05 deg (DR2's bound on a regular granule); framing_bc_max_km about 15 ms of
# acquisition time at 6.81 km/s; framing_xt_max_km 3.8 times the largest across-track spread read (2.643 km)
framing_max_km = 11.27
framing_max_share = 0.25
framing_anchor_km = 5.64
framing_bc_max_km = 0.1
framing_xt_max_km = 10
# v0.13, G0.16's anchor where the table has no footprint (R8-c, R8-g; ascending record 13.3 H): the frame law, the scene
# centre's latitude against the frame number at the standard beam: intercept, slope, and the frames it serves (the tested
# range and 10 frames beyond). Fitted on ASF's L1.1 rows at 34.3 deg of the first three of the seven catalogue files of
# 13.3 (ascending 2,582 rows of frames 90 to 340, descending 98 rows of frames 3260 to 3510; rows over 0.1 deg off left
# out: orbits 26031 and 12261, framed about 0.27 deg south), tested on the other four (2,932 and 315 rows); residual sd
# 0.0043 and 0.0040 deg
framing_law_A = 0.92026 0.0496858 80 440
framing_law_D = 179.79800 -0.0496893 3140 3610
framing_law_beam = 34.3
framing_law_band_deg = 0.82
framing_law_check_km = 2
# v0.13, G0.14 on the frame's own CEOS corners (R8-b, ascending record 13.4): a table footprint side further than
# footprint_check_deg from the derived one WARNs (twice the largest difference on RA2's 21 cells, 0.0245 deg); a corner
# further than footprint_corner_max_deg from its granule's (c) cannot be used (2.6 times the largest offset read, 0.386)
footprint_check_deg = 0.05
footprint_corner_max_deg = 1.0

