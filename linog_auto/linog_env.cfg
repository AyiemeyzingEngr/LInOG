# linog_env.cfg -- the ISCE environment and the tool pins for Phase 1 onward (linog_auto v0.2; v0.13: UNPACKER).
# KEY=value lines only: sourced by lp_env.sh, parsed by lp_p1.py. Tests point LINOG_ENV_CFG at their own copy.
# Every value was measured on felix (RD2, 26 Sept 2026) or read from the course kit manifest (25 Sept, 60 of 60 OK).
CONDA_SH=/eggraid/miniconda3/etc/profile.d/conda.sh
CONDA_ENV=linog_isce2
# the LInOG unpacker (frame, doppler, fmrate in the shelve), always by absolute path: the env's stock copy comes first on the PATH
# v0.13 (ascending record 14.2, item 1): the package's own copy, the course kit's bin/unpackFrame_ALOS.py byte for byte, at a
# path any felix account reads (v0.2 to v0.12: /home/arieln/bin/unpackFrame_ALOS.py, behind /home/arieln at 750)
UNPACKER=/eggraid/home/arieln/projects/linog/insar/pipeline/v0.13/unpackFrame_ALOS.py
UNPACKER_MD5=c037bd4ee1e90f2c9c2e3eb56d2e1a3a
# the kit's own post-unpack checks, run as cross-checks with PYTHONPATH=<isce>/components
KIT=/eggraid/home/arieln/projects/linog/insar/scripts
KIT_UNPACK_VERIFY_MD5=ee37fbfd6d9e608e6fca308cc135c4ec
KIT_SHELVE_GATE_MD5=ac1a8275deabe7ec2f16e0cd54677713
# the ALOS range-gate grid the kit checks r0 against (linog_unpack_verify.py); path 84 sits on it (RD2: -5 steps)
GATE_GRID_M=149.89632
GATE_R0REF_M=845217.5596
# chirp bandwidth by mode, MHz (|chirp slope| x pulse length; RD2: 28.000 for FBS)
BW_FBS_MHZ=28.0
BW_FBD_MHZ=14.0
