#
# -- gate settings, as the kit and the catalogue measured them
# G7: when the window survey finds fewer windows than the quorum, the survey is repeated once at this depth
# (LINOG_REG_NCAND; p449 f0280 reached quorum at 60 with the same verdict; depth only, no threshold changes)
G7_NCAND_RETRY=60
# G8 (catalogue): FAIL when this share of the reference's pairs or more exceeds |az| G8_AZ_PX; |rg| > G8_RG_PX is listed (N52)
G8_AZ_PX=10
G8_SHARE=0.25
G8_RG_PX=5
# G11: the kit census's coherence mark; a date none of whose pairs reaches it is listed
COH_MARK=0.30
# topo: |value| above this in geom_reference/hgt.rdr counts as ISCE fill (E62: 1e5, not 1e6)
HGT_FILL_ABS=100000
