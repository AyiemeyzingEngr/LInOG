# linog_fftw.cfg -- the pinned FFTW wisdom for ISCE2's cfft1d_jpl, through which ampcor (refine), crossmul and icu (igram)
# plan their FFTs (linog_auto v0.9; record 80.3, 80.5 and 81). KEY=value lines only; parsed by lp_fftw.py. Tests point
# LINOG_FFTW_CFG at their own copy. A new file: linog_env.cfg's md5 is in unpack's and verify's fingerprints (lp_unpack.py,
# lp_verify.py), so a change there would make every frame STALE from Phase 1b on; linog_run.cfg stays as v0.8 had it.
# Every value was measured on felix by S25 (4 Oct 2026; record 80.6 and 81): == 4 and == 5, and fftw/facts.json in its pull.
#
# -- the wisdom file (relative to this pipeline folder, or absolute) and its md5: S25's fftw/wisdom.wis, made on felix by
# fftw25.py gen (512 plans, 29.9 s, 76,068 B, 797 lines); with it 512 of 512 problems covered on felix, without it 0
WISDOM=fftw/wisdom_felix.wis
WISDOM_MD5=e1b94d18cbef8b7cc3f8bf22256048bc
# -- the library the three modules load: ENV_PREFIX/lib/libfftw3f.so.3 resolves to ENV_PREFIX/FFTW_LIB_REL (conda-forge
# fftw 3.3.11 nompi_h3b011a4_100, its build prefix replaced by the env's at install, as conda does)
FFTW_LIB_REL=lib/libfftw3f.so.3.7.11
FFTW_LIB_MD5=7333f0827f98ead7b724dd5d639a2f50
FFTW_VERSION=fftw-3.3.11-sse2-avx
# -- ISCE2's modules that take their FFTs from cfft1d_jpl, relative to the isce package folder (conda-forge isce2 2.6.4
# py311h916084f_2; the same md5s in that package)
AMPCOR_SO=components/mroipac/ampcor/ampcor.abi3.so
AMPCOR_SO_MD5=51b0185424eeb03292252c84e6f0b41e
CROSSMUL_SO=components/stdproc/stdproc/crossmul/crossmul.abi3.so
CROSSMUL_SO_MD5=8646fae0123c11d6a8543b44e75c9153
ICU_SO=components/mroipac/icu/icu.abi3.so
ICU_SO_MD5=59902c61b8c44f616f03f1aaa0bd3241
# -- the problems cfft1d_jpl can plan (in place, complex single precision, FFTW_MEASURE): sizes 2**SIZE_MIN to
# 2**SIZE_MAX, both directions, at OFFSET_MIN to OFFSET_MAX bytes from an aligned start in steps of OFFSET_STEP (FFTW
# keys wisdom on the alignment class; on felix the 16 offsets fall in classes 0, 4, 8 and 12)
SIZE_MIN=2
SIZE_MAX=17
OFFSET_MIN=0
OFFSET_MAX=60
OFFSET_STEP=4
PROBLEMS=512
